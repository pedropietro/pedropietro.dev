---
layout: base
link: /
title: Pedro Pietroluongo
description: Links de Pedro Pietroluongo
---
<img id="image"
     class="2xl:w-1/6 xl:w-1/6 lg:w-1/5 md:w-1/3 w-1/2 sm:1/2 rounded-full m-auto shadow-2xl lg:border-2 md:border-2 sm:border-2"
     src="https://images.weserv.nl/?url={cdi:profile.image_url}&h=300&w=300&fit=cover&mask=circle&l=9&output=webp&q=75"
     alt="{cdi:profile.name}">
<br>
<h1 class="text-5xl text-center font-semibold mt-3 mx-auto">{cdi:profile.name}</h1>
<hr class="my-2 opacity-25">
<p class="text-base break-words inline-flex font-normal mt-1.5 mx-auto text-center opacity-50 2xl:w-5/12 xl:w-5/12 md:w-6/12 sm:w-full justify-center">{cdi:profile.tagline}</p>
<div class="grid 2xl:grid-cols-5 xl:grid-cols-4 lg:grid-cols-4 md:grid-cols-3 sm:grid-cols-1 my-7">
    {#for link in cdi:profile.links}
    {#if link.url??}
    <a class="flex" href="{link.url}{#if link.username??}/{link.username}{/if}" target="_blank" rel="noopener noreferrer">
        <button class="links min-h-auto lg:m-5 text-white hover:opacity-75 font-semibold my-2.5 mx-5 px-5 py-1.5 rounded-md w-full place-content-center h-14 w-32"
                style="background-color: {link.color}; box-shadow: 0px 10px 25px 0px {link.color}80;">
            <span {#if link.text_color??}style="color: {link.text_color};"{/if}>
                <i class="{link.icon_class} align-middle"></i><span class="mx-1.5 align-middle">{link.name}</span>
            </span>
        </button>
    </a>
    {/if}
    {/for}
</div>
